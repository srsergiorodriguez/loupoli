name: Deploy loupoli web app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build app and landing page
        shell: bash
        run: |
          # Project Pages use /<repo>/app/. A custom domain can set the
          # repository variable PWA_BASE_PATH to /app/ instead.
          BASE="${{ vars.PWA_BASE_PATH }}"
          if [ -z "$BASE" ]; then
            BASE="/${GITHUB_REPOSITORY#*/}/app/"
          fi
          npm run build -- --base="$BASE"
          rm -rf deploy
          mkdir -p deploy/app
          cp -R site/. deploy/
          cp -R dist/. deploy/app/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: deploy

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
